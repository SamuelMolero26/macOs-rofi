  - id: lifecycle.process-view-and-mode
    class: semantic
    milestone: CLI
    risk: critical
    source_evidence: [source/rofi.c, source/view.c, source/display.c, include/view.h, include/display.h]
    swift_evidence: [Sources/RofiCore/Arguments.swift, Sources/RofiCore/DmenuPipeline.swift, Sources/RofiCore/DmenuSession.swift, Sources/RofiAppKit/DmenuPanel.swift, Sources/rofi/main.swift, Tests/RofiCoreTests/ArgumentsTests.swift, Tests/RofiCoreTests/DmenuDumpTests.swift, Tests/RofiCoreTests/DmenuSessionTests.swift, Tests/RofiCoreTests/RowReaderTests.swift, Tests/CLITests/test_cli.py]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: The dmenu process reads stdin or a named input file, opened from its raw argument bytes, writes output, reports option and open failures, and exits deterministically. Asynchronous input runs on a reader thread that ends with the process. The panel finishes through accept, cancel, or window close; -only-match keeps it open on cancel, and a -multi-select toggle keeps it open. Reload, child cleanup, signal handling, and a shared mode lifecycle do not exist.

  - id: plugins.native-c-mode-abi
