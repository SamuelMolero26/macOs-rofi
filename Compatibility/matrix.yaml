  - id: modes.combi
    class: semantic
    milestone: MODES
    risk: high
    source_evidence: [source/modes/combi.c, include/modes/combi.h, source/mode.c]
    swift_evidence: []
    oracle_need: targeted
    spike_need: targeted
    status: planned
    divergence: No combined-mode namespacing, routing, display formatting, or delegated result handling exists.

  - id: apps.drun
    class: native
    milestone: MODES
    risk: critical
    source_evidence: [source/modes/drun.c, include/modes/drun.h, config/config.c]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
