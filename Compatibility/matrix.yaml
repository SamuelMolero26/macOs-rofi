  - id: modes.ssh
    class: semantic
    milestone: MODES
    risk: high
    source_evidence: [source/modes/ssh.c, include/modes/ssh.h, source/history.c]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
