  - id: input.keyboard-actions
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/keyb.c, include/input-codes.h, source/view.c, doc/rofi-keys.5.markdown, doc/rofi-actions.5.markdown]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift, Sources/RofiAppKit/PanelModel.swift, Sources/RofiAppKit/ModePanel.swift, Sources/RofiCore/DmenuSession.swift, Sources/RofiCore/ModeSwitcher.swift, Tests/RofiCoreTests/DmenuSessionTests.swift, Tests/RofiCoreTests/ModeSwitcherTests.swift]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: Return, Shift+Return, Escape, Up, and Down are handled in the search field and ignored while text is marked. Shift+Return is kb-accept-alt, which toggles the row under -multi-select and otherwise accepts like Return; under -show it always accepts like Return. Up and Down stop at the first and last rows where upstream's default cycle wraps. Under -show, Control+Tab is kb-mode-next and Control+Shift+Tab is kb-mode-previous; Shift+Right and Shift+Left are not bound to mode switching and keep native text selection, a deliberate divergence from upstream's default bindings. In dmenu those keys keep their AppKit behavior. No action map, keybinding parser, kb-mode-complete, kb-accept-custom, kb-accept-custom-alt, kb-delete-entry, kb-custom keys, kb-ellipsize, Tab, paging, or keyboard-layout policy exists.

  - id: input.pointer-actions
