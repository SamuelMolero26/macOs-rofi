  - id: media.icons
    class: native
    milestone: THEMES
    risk: high
    source_evidence: [source/rofi-icon-fetcher.c, source/widgets/icon.c, include/rofi-icon-fetcher.h, config/config.c]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: XDG icon themes and Cairo surfaces need NSImage, application-icon, file-icon, cache, and fallback mappings.

  - id: media.thumbnails
    class: native
    milestone: THEMES
    risk: high
    source_evidence: [source/rofi-icon-fetcher.c, doc/rofi-thumbnails.5.markdown]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: freedesktop thumbnailers and cache paths need a safe Quick Look or native thumbnail pipeline.

  - id: lifecycle.process-view-and-mode
    class: semantic
    milestone: CLI
    risk: critical
    source_evidence: [source/rofi.c, source/view.c, source/display.c, include/view.h, include/display.h]
    swift_evidence: [Sources/RofiCore/Arguments.swift, Sources/RofiCore/DmenuDump.swift, Sources/rofi/main.swift, Tests/RofiCoreTests/ArgumentsTests.swift, Tests/RofiCoreTests/DmenuDumpTests.swift]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: The dmenu dump process path reads stdin or a named input file, writes matches, reports option and open failures, and exits deterministically; cancellation, reload, child cleanup, view finalization, and signal handling do not exist.

  - id: plugins.native-c-mode-abi
    class: deferred
    milestone: PLUGINS
    risk: critical
    source_evidence: [include/mode.h, include/mode-private.h, source/mode.c, source/rofi.c]
    swift_evidence: []
    oracle_need: none
    spike_need: required
    status: deferred
    divergence: ABI version 7 exposes GLib, GModule, and Cairo-shaped contracts; preserving it would import the non-native stack or require a hazardous shim.
