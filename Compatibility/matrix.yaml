  - id: files.file-browser
    class: semantic
    milestone: MODES
    risk: high
    source_evidence: [source/modes/filebrowser.c, include/modes/filebrowser.h, Examples/rofi-file-browser.sh]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: Directory listing, hidden-file behavior, completion, opening, and sandbox-aware access are absent.

  - id: files.recursive-browser
    class: semantic
    milestone: MODES
    risk: high
    source_evidence: [source/modes/recursivebrowser.c, include/modes/recursivebrowser.h]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
