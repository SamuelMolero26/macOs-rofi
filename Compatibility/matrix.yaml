  - id: themes.native-rendering
    class: native
    milestone: THEMES
    risk: high
    source_evidence: [source/theme.c, source/css-colors.c, doc/default_theme.rasi, themes/dmenu.rasi]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: Cairo/Pango rendering properties need documented AppKit mappings and explicit unsupported-property behavior.

  - id: view.widgets-navigation-and-filtering
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/view.c, source/widgets/widget.c, source/widgets/box.c, source/widgets/listview.c, source/widgets/textbox.c, test/widget-test.c, test/box-test.c, test/textbox-test.c]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift, Sources/RofiCore/DmenuSession.swift, Tests/RofiCoreTests/DmenuSessionTests.swift]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: A search field and recycled-cell NSTableView render row text and mirror DmenuSession selection, with accessibility labels on the panel, field, and table. Results keep input order, so scoring is not wired. Prompt, message, line count, display strings, icons, urgent and active styling, columns, ballots, markup, and password entry are absent. The AppKit target has no automated tests; manual smoke is pending in the panel PR.

  - id: display.panel-placement-and-focus
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/display.c, source/xcb/display.c, source/wayland/display.c, source/xcb/view.c, source/wayland/view.c]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift]
    oracle_need: targeted
    spike_need: required
    status: partial
    divergence: An accessory app shows one borderless floating NSPanel, centered at a fixed 640x420, across all Spaces and full-screen spaces, and it stays visible when inactive. Activation is forced and focus retried once on the next run-loop turn for the unbundled CLI. Screen selection, location, width, and multi-display policy are absent, and focus awaits manual smoke.

  - id: display.x11-and-wayland-backends
    class: unsupported
    milestone: APPKIT
    risk: low
    source_evidence: [source/xcb/display.c, source/xcb/view.c, source/wayland/display.c, source/wayland/view.c]
    swift_evidence: []
    oracle_need: none
    spike_need: none
    status: unsupported
    divergence: Direct X11 and Wayland protocol compatibility is outside a native macOS application; only user-visible panel semantics are targeted.

  - id: input.keyboard-actions
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/keyb.c, include/input-codes.h, source/view.c, doc/rofi-keys.5.markdown, doc/rofi-actions.5.markdown]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift, Sources/RofiCore/DmenuSession.swift, Tests/RofiCoreTests/DmenuSessionTests.swift]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: Return, Escape, Up, and Down are handled in the search field and ignored while text is marked. No action map, keybinding parser, Tab, paging, custom keys, or keyboard-layout policy exists.

  - id: input.pointer-actions
    class: native
    milestone: APPKIT
    risk: high
    source_evidence: [source/keyb.c, source/view.c, source/widgets/listview.c, include/input-codes.h]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: The table inherits NSTableView click selection and scrolling, unverified at runtime. Double-click accept, hover, and pointer action dispatch are absent.

  - id: input.clipboard-and-ime
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/display.c, source/view.c, source/widgets/textbox.c, source/keyb.c]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift]
    oracle_need: targeted
    spike_need: required
    status: partial
    divergence: Query updates and key commands wait while the search field has marked text, but IME composition awaits manual smoke. Clipboard behavior is whatever the native field provides; rofi's selection semantics have no contract yet.

  - id: media.icons
    class: native
    milestone: THEMES
    risk: high
    source_evidence: [source/rofi-icon-fetcher.c, source/widgets/icon.c, include/rofi-icon-fetcher.h, config/config.c]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: XDG icon themes and Cairo surfaces need NSImage, application-icon, file-icon, cache, and fallback mappings.

  - id: media.thumbnails
    class: native
    milestone: THEMES
    risk: high
    source_evidence: [source/rofi-icon-fetcher.c, doc/rofi-thumbnails.5.markdown]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: freedesktop thumbnailers and cache paths need a safe Quick Look or native thumbnail pipeline.

  - id: lifecycle.process-view-and-mode
    class: semantic
    milestone: CLI
    risk: critical
    source_evidence: [source/rofi.c, source/view.c, source/display.c, include/view.h, include/display.h]
    swift_evidence: [Sources/RofiCore/Arguments.swift, Sources/RofiCore/DmenuPipeline.swift, Sources/RofiCore/DmenuSession.swift, Sources/RofiAppKit/DmenuPanel.swift, Sources/rofi/main.swift, Tests/RofiCoreTests/ArgumentsTests.swift, Tests/RofiCoreTests/DmenuDumpTests.swift, Tests/RofiCoreTests/DmenuSessionTests.swift]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: The dmenu process reads stdin or a named input file, writes output, reports option and open failures, and exits deterministically. The panel finishes through accept, cancel, or window close, and -only-match keeps it open on cancel. Reload, child cleanup, signal handling, and a shared mode lifecycle do not exist.

  - id: plugins.native-c-mode-abi
    class: deferred
    milestone: PLUGINS
    risk: critical
    source_evidence: [include/mode.h, include/mode-private.h, source/mode.c, source/rofi.c]
    swift_evidence: []
    oracle_need: none
    spike_need: required
    status: deferred
    divergence: ABI version 7 exposes GLib, GModule, and Cairo-shaped contracts; preserving it would import the non-native stack or require a hazardous shim.
