schema_version: 1

upstream:
  url: https://github.com/davatorium/rofi
  revision: 1ad1df6b72d4c8b0e40e8ced1249ef8a8a6bc0ad
  manifest: Compatibility/rofi-1ad1df6b/manifest.json

swift_baseline:
  tasks_complete: [T1, T2, T3, T4, T5]
  next_task: CLI
  executable: dmenu-and-script-show
  appkit: dmenu-and-mode-panel

milestones:
  T1: Swift package, executable stub, and separator parser
  T2: row metadata and row ranges
  T3: tokenizer and matching methods
  T4: dmenu output format and exit-code mapping
  T5: scorers and history store
  CLI: executable configuration and dmenu/script orchestration
  APPKIT: native panel, view, and input shell
  MODES: native and semantic mode integrations
  THEMES: RASI, styling, icons, and thumbnails
  PLUGINS: explicit extension policy after the native core is stable

items:
  - id: cli.arguments-and-config
    class: semantic
    milestone: CLI
    risk: critical
    source_evidence: [source/rofi.c, source/xrmoptions.c, config/config.c, test/helper-config-cmdline-parser.c]
    swift_evidence: [Package.swift, Sources/RofiCore/Arguments.swift, Sources/RofiCore/DmenuPipeline.swift, Sources/RofiCore/ShowOptions.swift, Sources/rofi/main.swift, Tests/RofiCoreTests/ArgumentsTests.swift, Tests/RofiCoreTests/DmenuDumpTests.swift, Tests/RofiCoreTests/DmenuPipelineTests.swift, Tests/RofiCoreTests/RenderingFlagsTests.swift, Tests/RofiCoreTests/DisplayColumnsTests.swift, Tests/RofiCoreTests/ShowOptionsTests.swift, Tests/CLITests/test_cli.py]
    oracle_need: required
    spike_need: none
    status: partial
    divergence: Rofi-style argument lookup runs over the raw argv bytes, and every flag dmenu.c looks up is read, along with the -filter, -matching, -tokenize, -case-smart, -normalize-match, -matching-negate-char, and -auto-select options. Values used as bytes or C strings, such as -sep, -matching-negate-char, and -input, keep non-UTF-8 bytes. An argv[0] basename of exactly dmenu starts dmenu mode. An unknown -ellipsize-mode is dropped silently where rofi warns. Outside dmenu, -modes, -modi, and -switchers are read with -modes winning over -modi over -switchers, split on commas or hash signs with duplicates kept, along with -show, -display-<name>, -sidebar-mode, and the matching options including -case-sensitive. Only name:path script specs resolve; the default mode list is empty instead of window,drun,run,ssh, a bare name finds no script in the configuration directory, and built-in names are not found. -display-<name> applies to script modes, where upstream registers it after parsing the command line so it has no effect on them. The theme display-name property is not read. No configuration file, -dump-config, -dump-theme, -help, or -e exists; -help and -e fall through to the unsure-what-to-show text.

  - id: cli.diagnostics-and-exit-contract
    class: semantic
    milestone: CLI
    risk: high
    source_evidence: [source/rofi.c, source/modes/dmenu.c, doc/rofi.1.markdown, doc/rofi-dmenu.5.markdown]
    swift_evidence: [Sources/rofi/main.swift, Sources/RofiCore/DmenuPipeline.swift, Sources/RofiCore/DmenuSession.swift, Sources/RofiCore/OutputFormat.swift, Sources/RofiCore/ShowOptions.swift, Sources/RofiCore/ScriptMode.swift, Tests/RofiCoreTests/DmenuDumpTests.swift, Tests/RofiCoreTests/DmenuSessionTests.swift, Tests/RofiCoreTests/OutputFormatTests.swift, Tests/RofiCoreTests/ShowOptionsTests.swift, Tests/CLITests/test_cli.py]
    oracle_need: required
    spike_need: none
    status: partial
    divergence: The dmenu dump path exits 0, including when no rows match; interactive accept exits 0 and cancel exits 1 through the shared outcome mapping. An invalid -matching value exits 65 (EX_DATAERR) and reports every unknown name and the too-many-methods error in config_sanity_check's wording with its markup removed. Diagnostics go to stderr, prefixed rofi:, instead of rofi's error dialog. Input-open failures exit 1 and are checked before the panel opens, so a path that becomes unreadable after that check fails with the panel already up. A -show panel prints nothing and exits 0 on accept and cancel. An unknown name in the mode list or -show reports "Mode X is not found" with the known modes and exits 65; mode-list and -matching errors share one startup message that shows two errors and upstream's off-by-one count of the rest. The disabled-mode warning for an unlisted -show script goes to stderr only when stdout is a terminal, as upstream. Without -show the unsure-what-to-show text goes to stderr and exits 0, listing no modes that can be enabled because no built-in mode exists. A script that cannot start at -show reports upstream's Failed to execute wording and exits 0 without a panel. Help, configuration diagnostics, and -e are not implemented.

  - id: mode.state-machine
    class: semantic
    milestone: CLI
    risk: critical
    source_evidence: [include/mode.h, include/mode-private.h, source/mode.c, source/rofi.c, source/view.c, source/widgets/listview.c, test/mode-test.c]
    swift_evidence: [Sources/RofiCore/Mode.swift, Sources/RofiCore/ModeSwitcher.swift, Sources/RofiCore/ShowOptions.swift, Sources/RofiCore/ScriptMode.swift, Sources/RofiAppKit/ModePanel.swift, Sources/rofi/main.swift, Tests/RofiCoreTests/ModeSwitcherTests.swift, Tests/RofiCoreTests/ShowOptionsTests.swift, Tests/RofiCoreTests/ScriptModeTests.swift, Tests/CLITests/test_cli.py]
    oracle_need: targeted
    spike_need: targeted
    status: partial
    divergence: A class-bound Mode protocol offers rows, a message, a display name, a post-result selection, token matching, and a result for ok, custom input, cancel, delete entry, and custom keys. The switcher resolves next, previous, and quick switch before a mode is asked, and applies exit, next, previous, reload, reset, and switch-to-index results with wraparound, an input rewrite or clear, and the query kept and refiltered across a switch. The visible selection is kept and clamped to the new matches. Every listed mode initializes before the panel opens, and the prompt, window title rofi - <display name>, and message follow the current mode. Only script modes exist, and dmenu does not run on the Mode protocol. Icons, completion, preprocess_input, and on_mode_changed are absent, and results are never sorted. Each list entry gets its own mode instance where upstream reuses one for a repeated bare name. Cancel passes no row where upstream passes a stale selected line, a negative switch index wraps where upstream's is unsigned, and a mode's requested row is looked up in the matches after the reload instead of before it.

  - id: matching.methods-and-tokenization
    class: exact
    milestone: T3
    risk: medium
    source_evidence: [source/helper.c, test/helper-tokenize.c, test/helper-test.c]
    swift_evidence: [Sources/RofiCore/Matcher.swift, Sources/RofiCore/DmenuPipeline.swift, Tests/RofiCoreTests/MatcherTests.swift, Tests/RofiCoreTests/DmenuDumpTests.swift, Tests/CLITests/test_cli.py]
    oracle_need: none
    spike_need: none
    status: partial
    divergence: Invalid regex fallback and normalization are covered; NSRegularExpression (ICU) is used instead of GRegex (PCRE2), so regex patterns whose syntax differs between the engines can match differently; this keeps the exact class partial. The negate character is compared and skipped as the token's first raw byte, as upstream does; a stray continuation byte left behind decodes to U+FFFD, so the token never matches, which agrees with GRegex rejecting it unless the row text itself contains U+FFFD. -matching validates every name and errors on the fifth recognized one, as config_sanity_check does.

  - id: matching.scoring-and-order
    class: exact
    milestone: T5
    risk: high
    source_evidence: [source/helper.c, include/helper.h, test/helper-test.c]
    swift_evidence: [Sources/RofiCore/Scorer.swift, Tests/RofiCoreTests/ScorerTests.swift]
    oracle_need: required
    spike_need: none
    status: partial
    divergence: Levenshtein and the original fzf scorer are implemented over Unicode code points; fzf-v2, its sort key, tie-breaking, and integration into a view ordering pipeline remain absent.

  - id: history.store-and-ranking
    class: exact
    milestone: T5
    risk: high
    source_evidence: [source/history.c, include/history.h, test/history-test.c]
    swift_evidence: [Sources/RofiCore/History.swift, Tests/RofiCoreTests/HistoryTests.swift]
    oracle_need: targeted
    spike_need: targeted
    status: complete
    divergence: Parsing, stable ranking, size capping, persistence, disabled history, and ignored prefixes are implemented for a caller-provided URL; invalid list bytes decode to U+FFFD, write failures are silent, and rofi's ignored-prefix mutation bug is not reproduced. No mode calls the store yet.

  - id: dmenu.byte-stream-and-row-metadata
    class: exact
    milestone: CLI
    risk: critical
    source_evidence: [source/modes/dmenu.c, source/modes/script.c, source/helper.c, doc/rofi-dmenu.5.markdown]
    swift_evidence: [Sources/RofiCore/Separator.swift, Sources/RofiCore/ForceUTF8.swift, Sources/RofiCore/Row.swift, Sources/RofiCore/RowRange.swift, Sources/RofiCore/RowSplitter.swift, Sources/RofiCore/DmenuPipeline.swift, Sources/RofiAppKit/DmenuPanel.swift, Sources/rofi/main.swift, Tests/RofiCoreTests/SeparatorTests.swift, Tests/RofiCoreTests/ForceUTF8Tests.swift, Tests/RofiCoreTests/RowTests.swift, Tests/RofiCoreTests/RowRangeTests.swift, Tests/RofiCoreTests/RowSplitterTests.swift, Tests/RofiCoreTests/RowReaderTests.swift, Tests/RofiCoreTests/DmenuDumpTests.swift, Tests/RofiCoreTests/DmenuPipelineTests.swift, Tests/CLITests/test_cli.py]
    oracle_need: required
    spike_need: targeted
    status: partial
    divergence: Input is read as raw bytes, each invalid UTF-8 byte is repaired, NUL-delimited metadata is preserved, rows split incrementally, and -sep parses like helper_parse_char, using strtol for \xHH. Unless -sync, -dump, -select, -selected-row, -no-custom, -only-match, or auto-select forces sync input, the panel opens at once and rows stream in from a reader thread. A partial line waits for its separator or EOF instead of being flushed after 250 ms, and a read error ends input silently. Row extras decode invalid UTF-8 to U+FFFD instead of keeping raw bytes, and row-range numbers that overflow parse as 0 instead of clamping like strtol. The meta extra is parsed but never matched, and permanent rows are parsed but do not always match.

  - id: dmenu.selection-and-multiselect
    class: semantic
    milestone: CLI
    risk: high
    source_evidence: [source/modes/dmenu.c, include/modes/dmenu.h, source/view.c, doc/rofi-dmenu.5.markdown]
    swift_evidence: [Sources/RofiCore/Arguments.swift, Sources/RofiCore/DmenuPipeline.swift, Sources/RofiCore/DmenuSession.swift, Sources/RofiCore/OutputFormat.swift, Sources/RofiCore/RowRange.swift, Sources/RofiAppKit/DmenuPanel.swift, Sources/rofi/main.swift, Tests/RofiCoreTests/ArgumentsTests.swift, Tests/RofiCoreTests/DmenuDumpTests.swift, Tests/RofiCoreTests/DmenuPipelineTests.swift, Tests/RofiCoreTests/DmenuSessionTests.swift, Tests/RofiCoreTests/OutputFormatTests.swift, Tests/RofiCoreTests/RowRangeTests.swift]
    oracle_need: required
    spike_need: targeted
    status: partial
    divergence: Dump filtering, original-index formatting, auto-select, interactive single selection, custom input, non-selectable rows, and only-match/no-custom policy are implemented. -select starts on the first row its query matches with the configured matching, else on -selected-row. -a and -u ranges, negative ones included, resolve against the rows loaded so far and combine with each row's active and urgent extras. -multi-select toggles the highlighted row with Shift+Return behind configurable ballots, shows a selected/total count in the overlay slot, and prints every toggled row in input order. kb-accept-custom and kb-accept-custom-alt are not bound, and auto-select can complete with a nonselectable row.

  - id: dmenu.output-format
    class: exact
    milestone: T4
    risk: medium
    source_evidence: [source/helper.c, source/modes/dmenu.c]
    swift_evidence: [Sources/RofiCore/OutputFormat.swift, Sources/RofiCore/Markup.swift, Tests/RofiCoreTests/OutputFormatTests.swift, Tests/RofiCoreTests/MarkupTests.swift, Tests/RofiCoreTests/RenderingFlagsTests.swift]
    oracle_need: targeted
    spike_need: none
    status: partial
    divergence: -format p strips markup through the shared XMLParser-based Pango parser, which validates tag names but ignores unknown span attributes and unparsable values that Pango rejects. Under -markup-rows the output stays the raw row text, as upstream prints it. The 2026-10-29 spike found -format p diverging on 21 of 87 vectors; no re-run against the shared parser is recorded.

  - id: script.headers-and-row-protocol
    class: exact
    milestone: CLI
    risk: critical
    source_evidence: [source/modes/script.c, include/modes/script.h, doc/rofi-script.5.markdown, Examples/test_script_mode_delim.sh]
    swift_evidence: [Sources/RofiCore/Separator.swift, Sources/RofiCore/ForceUTF8.swift, Sources/RofiCore/Row.swift, Sources/RofiCore/RowRange.swift, Sources/RofiCore/RowSplitter.swift, Sources/RofiCore/ScriptMode.swift, Sources/RofiCore/Matcher.swift, Tests/RofiCoreTests/SeparatorTests.swift, Tests/RofiCoreTests/ForceUTF8Tests.swift, Tests/RofiCoreTests/RowTests.swift, Tests/RofiCoreTests/RowRangeTests.swift, Tests/RofiCoreTests/RowSplitterTests.swift, Tests/RofiCoreTests/ScriptModeTests.swift, Tests/RofiCoreTests/MatcherTests.swift]
    oracle_need: required
    spike_need: targeted
    status: partial
    divergence: Script output splits on the current delimiter, a delim header changes it for the records after it and persists across runs, empty records are dropped, and a header needs a value byte after its \x1f. Rows carry the shared row extras, row text is repaired to UTF-8, and display, active, and urgent extras reach the panel. The prompt, message, data, no-custom, and use-hot-keys headers are honored; an empty message clears it. The markup-rows, urgent, active, keep-selection, keep-filter, new-selection, theme, and switch-mode headers are parsed and ignored. Matching follows script_token_match, so a permanent row always matches and a token decided against the text is retried on the meta extra, but markup is not stripped first. Row extras decode invalid UTF-8 to U+FFFD, and the icon extra is not shown.

  - id: script.execution-and-reload
    class: semantic
    milestone: MODES
    risk: critical
    source_evidence: [source/modes/script.c, source/view.c, include/mode.h, Examples/test_script_mode.sh, Examples/test_script_env.sh]
    swift_evidence: [Sources/RofiCore/ScriptMode.swift, Sources/RofiCore/ModeSwitcher.swift, Sources/rofi/main.swift, Tests/RofiCoreTests/ScriptModeTests.swift, Tests/RofiCoreTests/ModeSwitcherTests.swift, Tests/CLITests/test_cli.py]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: A name:path script runs once with no argument when the mode initializes, then with the accepted row's text, the custom input, or the deleted row, with ROFI_RETV 1, 2, 3, or 10 plus the custom key index, and ROFI_OUTSIDE, ROFI_INFO, ROFI_DATA, and ROFI_INPUT set. The command splits like g_shell_parse_argv without expansions and is searched on PATH, with stdin from /dev/null, stderr and the working directory inherited, and other descriptors closed; stdout is read to the end before the panel continues. New rows reload with source row 0 selected and the input cleared, empty output exits, a nonselectable row or refused custom input under no-custom reloads, and a custom key without use-hot-keys switches to that mode index. The argument is the row's UTF-8-repaired text, not its raw bytes, and the child is reaped where upstream never waits. keep-selection, keep-filter, and new-selection are not honored. The panel binds no kb-delete-entry or kb-custom keys, so delete and custom-key runs are reachable only from RofiCore. A spawn failure prints the error dialog's wording on stderr; at startup it exits 0 without a panel, and on a later run the mode ends with no rows and the message follows when the panel closes.

