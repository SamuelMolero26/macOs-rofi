  - id: input.pointer-actions
    class: native
    milestone: APPKIT
    risk: high
    source_evidence: [source/keyb.c, source/view.c, source/widgets/listview.c, include/input-codes.h]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: Click, double-click, scroll, hover, and pointer action dispatch are absent.

  - id: input.clipboard-and-ime
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/display.c, source/view.c, source/widgets/textbox.c, source/keyb.c]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
