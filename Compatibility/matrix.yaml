  - id: windows.selection-and-activation
    class: native
    milestone: MODES
    risk: critical
    source_evidence: [source/modes/window.c, source/modes/wayland-window.c, include/modes/window.h, include/modes/wayland-window.h]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: X11 and Wayland window metadata/actions require a permission-aware Accessibility and NSWorkspace design.

  - id: themes.rasi-parser-and-cascade
    class: semantic
    milestone: THEMES
    risk: critical
    source_evidence: [lexer/theme-lexer.l, lexer/theme-parser.y, source/theme.c, test/theme-parser-test.c, doc/rofi-theme.5.markdown]
    swift_evidence: []
    oracle_need: required
    spike_need: targeted
    status: planned
    divergence: No RASI parser, imports, variables, media conditions, selector cascade, or diagnostics exist.

  - id: themes.native-rendering
    class: native
    milestone: THEMES
    risk: high
    source_evidence: [source/theme.c, source/css-colors.c, doc/default_theme.rasi, themes/dmenu.rasi]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: Cairo/Pango rendering properties need documented AppKit mappings and explicit unsupported-property behavior.

  - id: view.widgets-navigation-and-filtering
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/view.c, source/widgets/widget.c, source/widgets/box.c, source/widgets/listview.c, source/widgets/textbox.c, test/widget-test.c, test/box-test.c, test/textbox-test.c]
    swift_evidence: []
    oracle_need: required
    spike_need: required
    status: next
    divergence: No AppKit view exists; the next feature is an NSPanel search field and list wired to the landed row, matching, scoring, and formatting pipeline. Virtualization, navigation, and accessibility remain unimplemented.

  - id: display.panel-placement-and-focus
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/display.c, source/xcb/display.c, source/wayland/display.c, source/xcb/view.c, source/wayland/view.c]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: next
    divergence: The next feature introduces the first NSPanel for search and list display; screen selection, placement policy, focus behavior, activation policy, and multi-display behavior remain unimplemented.

  - id: display.x11-and-wayland-backends
    class: unsupported
    milestone: APPKIT
    risk: low
    source_evidence: [source/xcb/display.c, source/xcb/view.c, source/wayland/display.c, source/wayland/view.c]
    swift_evidence: []
    oracle_need: none
    spike_need: none
    status: unsupported
    divergence: Direct X11 and Wayland protocol compatibility is outside a native macOS application; only user-visible panel semantics are targeted.

  - id: input.keyboard-actions
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/keyb.c, include/input-codes.h, source/view.c, doc/rofi-keys.5.markdown, doc/rofi-actions.5.markdown]
    swift_evidence: []
    oracle_need: required
    spike_need: required
