  - id: themes.native-rendering
    class: native
    milestone: THEMES
    risk: high
    source_evidence: [source/theme.c, source/css-colors.c, doc/default_theme.rasi, themes/dmenu.rasi]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: Cairo/Pango rendering properties need documented AppKit mappings and explicit unsupported-property behavior. Only dmenu row and message markup maps to AppKit attributes so far, with fixed system colors for active and urgent rows (see view.widgets-navigation-and-filtering); no theme property is read.

  - id: view.widgets-navigation-and-filtering
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/view.c, source/widgets/widget.c, source/widgets/box.c, source/widgets/listview.c, source/widgets/textbox.c, test/widget-test.c, test/box-test.c, test/textbox-test.c]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift, Sources/RofiAppKit/PanelModel.swift, Sources/RofiAppKit/ModePanel.swift, Sources/RofiAppKit/Markup+AppKit.swift, Sources/RofiCore/DmenuPipeline.swift, Sources/RofiCore/DmenuSession.swift, Sources/RofiCore/ModeSwitcher.swift, Sources/RofiCore/Markup.swift, Tests/RofiCoreTests/DmenuPipelineTests.swift, Tests/RofiCoreTests/DmenuSessionTests.swift, Tests/RofiCoreTests/DisplayColumnsTests.swift, Tests/RofiCoreTests/RenderingFlagsTests.swift, Tests/RofiCoreTests/MarkupTests.swift, Tests/RofiCoreTests/ModeSwitcherTests.swift]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: A prompt label, search field, optional -mesg label, recycled-cell NSTableView, and an overlay label for "Loading.. " or the multi-select count render the session, with accessibility labels. -l fixes the visible row count. Rows show their display extra or -display-columns projection, ballots under -multi-select, blue active or red urgent text with active winning, and -ellipsize-mode or -keep-right truncation. Pango markup becomes an NSAttributedString for -markup-rows rows and for -mesg, invalid markup shows raw, and matching under -markup-rows uses the markup's text. Only hex colors are parsed, and the column separator is an ICU regex instead of PCRE. -password uses NSSecureTextField, which shows bullets instead of "*". Under -show the same panel redraws after every switch and mode result. The prompt, window title, and message follow the current mode, the message bar appears and disappears with the message, and a query the mode rewrites replaces the field with the cursor at its end. -sidebar-mode adds a mode-switcher row below the list, an NSSegmentedControl with one equal-width segment per mode labeled with its display name when built and highlighting the current mode; it never takes focus. A theme cannot add that row because no theme is read. Results keep input order because scoring is not wired, and match highlighting, row icons, and kb-ellipsize are absent. The AppKit target has no automated tests; manual and scripted smoke passed on 2026-11-02 for dmenu and on 2026-11-04 for -show switching, wraparound, the kept query, reload on accept, and the switcher row.

  - id: display.panel-placement-and-focus
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/display.c, source/xcb/display.c, source/wayland/display.c, source/xcb/view.c, source/wayland/view.c]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift, Sources/RofiAppKit/PanelModel.swift, Sources/RofiAppKit/ModePanel.swift]
    oracle_need: targeted
    spike_need: required
    status: partial
    divergence: An accessory app shows one borderless floating NSPanel, 640 points wide and centered, across all Spaces and full-screen spaces, and it stays visible when inactive. -b moves it to the bottom center of the visible frame instead of dmenu's full-width bar, -l or -mesg size it around a fixed row count capped at the screen height, and it never slides under the menu bar. A -show panel always uses the default centered 640x420 size and ignores -l and -b, which upstream applies to every mode. Activation is forced and focus retried once on the next run-loop turn for the unbundled CLI; focus passed manual smoke. Screen selection, -location, -width, and multi-display policy are absent.

