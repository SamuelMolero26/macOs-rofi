    divergence: Clicking a -sidebar-mode switcher segment switches to that mode as MENU_QUICK_SWITCH does, keeping the query; it acts on mouse-up where upstream acts on press, and passed scripted smoke on 2026-11-04. The table inherits NSTableView click selection and scrolling, unverified at runtime. Double-click accept, hover, and other pointer action dispatch are absent.

