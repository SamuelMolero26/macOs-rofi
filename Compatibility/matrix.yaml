    swift_evidence: [Sources/RofiCore/Arguments.swift, Sources/RofiCore/DmenuPipeline.swift, Sources/RofiCore/DmenuSession.swift, Sources/RofiCore/ModeSwitcher.swift, Sources/RofiCore/ScriptMode.swift, Sources/RofiCore/ShowOptions.swift, Sources/RofiAppKit/DmenuPanel.swift, Sources/RofiAppKit/PanelModel.swift, Sources/RofiAppKit/ModePanel.swift, Sources/rofi/main.swift, Tests/RofiCoreTests/ArgumentsTests.swift, Tests/RofiCoreTests/DmenuDumpTests.swift, Tests/RofiCoreTests/DmenuSessionTests.swift, Tests/RofiCoreTests/RowReaderTests.swift, Tests/RofiCoreTests/ModeSwitcherTests.swift, Tests/RofiCoreTests/ScriptModeTests.swift, Tests/CLITests/test_cli.py]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: The dmenu process reads stdin or a named input file, opened from its raw argument bytes, writes output, reports option and open failures, and exits deterministically. Asynchronous input runs on a reader thread that ends with the process. The panel finishes through accept, cancel, or window close; -only-match keeps it open on cancel, and a -multi-select toggle keeps it open. A -show process initializes every listed mode, runs one panel that stays open across switches and reloads until a mode answers exit, and reaps each script child. dmenu and -show share the panel through a panel model but not the mode lifecycle. Signal handling does not exist.

