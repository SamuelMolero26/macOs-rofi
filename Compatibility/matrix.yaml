  - id: themes.native-rendering
    class: native
    milestone: THEMES
    risk: high
    source_evidence: [source/theme.c, source/css-colors.c, doc/default_theme.rasi, themes/dmenu.rasi]
    swift_evidence: []
    oracle_need: targeted
    spike_need: required
    status: planned
    divergence: Cairo/Pango rendering properties need documented AppKit mappings and explicit unsupported-property behavior. Only dmenu row and message markup maps to AppKit attributes so far, with fixed system colors for active and urgent rows (see view.widgets-navigation-and-filtering); no theme property is read.

  - id: view.widgets-navigation-and-filtering
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/view.c, source/widgets/widget.c, source/widgets/box.c, source/widgets/listview.c, source/widgets/textbox.c, test/widget-test.c, test/box-test.c, test/textbox-test.c]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift, Sources/RofiAppKit/Markup+AppKit.swift, Sources/RofiCore/DmenuPipeline.swift, Sources/RofiCore/DmenuSession.swift, Sources/RofiCore/Markup.swift, Tests/RofiCoreTests/DmenuPipelineTests.swift, Tests/RofiCoreTests/DmenuSessionTests.swift, Tests/RofiCoreTests/DisplayColumnsTests.swift, Tests/RofiCoreTests/RenderingFlagsTests.swift, Tests/RofiCoreTests/MarkupTests.swift]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: A prompt label, search field, optional -mesg label, recycled-cell NSTableView, and an overlay label for "Loading.. " or the multi-select count render the session, with accessibility labels. -l fixes the visible row count. Rows show their display extra or -display-columns projection, ballots under -multi-select, blue active or red urgent text with active winning, and -ellipsize-mode or -keep-right truncation. Pango markup becomes an NSAttributedString for -markup-rows rows and for -mesg, invalid markup shows raw, and matching under -markup-rows uses the markup's text. Only hex colors are parsed, and the column separator is an ICU regex instead of PCRE. -password uses NSSecureTextField, which shows bullets instead of "*". Results keep input order because scoring is not wired, and match highlighting, row icons, and kb-ellipsize are absent. The AppKit target has no automated tests; manual and scripted smoke passed on 2026-11-02.

  - id: display.panel-placement-and-focus
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/display.c, source/xcb/display.c, source/wayland/display.c, source/xcb/view.c, source/wayland/view.c]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift]
    oracle_need: targeted
    spike_need: required
    status: partial
    divergence: An accessory app shows one borderless floating NSPanel, 640 points wide and centered, across all Spaces and full-screen spaces, and it stays visible when inactive. -b moves it to the bottom center of the visible frame instead of dmenu's full-width bar, -l or -mesg size it around a fixed row count capped at the screen height, and it never slides under the menu bar. Activation is forced and focus retried once on the next run-loop turn for the unbundled CLI; focus passed manual smoke. Screen selection, -location, -width, and multi-display policy are absent.

  - id: display.x11-and-wayland-backends
    class: unsupported
    milestone: APPKIT
    risk: low
    source_evidence: [source/xcb/display.c, source/xcb/view.c, source/wayland/display.c, source/wayland/view.c]
    swift_evidence: []
    oracle_need: none
    spike_need: none
    status: unsupported
    divergence: Direct X11 and Wayland protocol compatibility is outside a native macOS application; only user-visible panel semantics are targeted.

  - id: input.keyboard-actions
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/keyb.c, include/input-codes.h, source/view.c, doc/rofi-keys.5.markdown, doc/rofi-actions.5.markdown]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift, Sources/RofiCore/DmenuSession.swift, Tests/RofiCoreTests/DmenuSessionTests.swift]
    oracle_need: required
    spike_need: required
    status: partial
    divergence: Return, Shift+Return, Escape, Up, and Down are handled in the search field and ignored while text is marked. Shift+Return is kb-accept-alt, which toggles the row under -multi-select and otherwise accepts like Return. No action map, keybinding parser, kb-accept-custom, kb-accept-custom-alt, kb-ellipsize, Tab, paging, custom keys, or keyboard-layout policy exists.

  - id: input.pointer-actions
    class: native
    milestone: APPKIT
    risk: high
    source_evidence: [source/keyb.c, source/view.c, source/widgets/listview.c, include/input-codes.h]
    swift_evidence: []
