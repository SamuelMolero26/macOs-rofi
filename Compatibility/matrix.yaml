    divergence: The table inherits NSTableView click selection and scrolling, unverified at runtime. Double-click accept, hover, and pointer action dispatch are absent.

  - id: input.clipboard-and-ime
    class: native
    milestone: APPKIT
    risk: critical
    source_evidence: [source/display.c, source/view.c, source/widgets/textbox.c, source/keyb.c]
    swift_evidence: [Sources/RofiAppKit/DmenuPanel.swift]
    oracle_need: targeted
    spike_need: required
    status: partial
    divergence: Query updates and key commands wait while the search field has marked text, and IME composition passed manual smoke. Under -password the NSSecureTextField offers no IME. Clipboard behavior is whatever the native field provides; rofi's selection semantics have no contract yet.

