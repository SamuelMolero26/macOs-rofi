name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify ShellCheck
        run: shellcheck --version

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" actionlint
          install -m 0755 actionlint "${RUNNER_TEMP}/actionlint"

      - name: Lint workflows
        run: |
          "${RUNNER_TEMP}/actionlint" -color

      - name: Install zizmor
        env:
          ZIZMOR_VERSION: 1.32.0
          ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            --output "${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${archive}"
          echo "${ZIZMOR_SHA256}  ${archive}" | sha256sum --check -
          tar --extract --gzip --file "${archive}" zizmor
          install -m 0755 zizmor "${RUNNER_TEMP}/zizmor"

      - name: Audit workflows
        run: |
          "${RUNNER_TEMP}/zizmor" --offline --min-severity low .github

  build-and-test:
    name: Swift build and test
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Report toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Lint
        run: make lint

      - name: Test
        run: make test
